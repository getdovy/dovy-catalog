name: Recipe request
description: Ask for software dovy does not have yet.
title: "Recipe request: "
labels: ["recipe request"]
body:
  - type: input
    id: name
    attributes:
      label: Software
      description: Its name.
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Homepage
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs
      description: What it is for, and why Debian stable's packages do not cover it (missing, or older).
    validations:
      required: true
  - type: input
    id: download
    attributes:
      label: Download
      description: A versioned download for Linux amd64 (.deb, archive, or the vendor's apt repository).
      placeholder: https://
    validations:
      required: true
  - type: input
    id: licence
    attributes:
      label: Licence
      description: Proprietary is fine.
    validations:
      required: true
