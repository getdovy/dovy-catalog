name: Recipe update
description: A newer version of a recipe is out.
title: "Recipe update: "
labels: ["recipe update"]
body:
  - type: input
    id: recipe
    attributes:
      label: Recipe
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: New version
    validations:
      required: true
  - type: input
    id: notes
    attributes:
      label: Release notes
      placeholder: https://
    validations:
      required: true
