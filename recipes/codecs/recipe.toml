name = "codecs"
description = "Audio and video codecs: FFmpeg, GStreamer, Intel hardware decoding"
kind = "setup"
version = "1"
revision = 3
maintainer = "hmwassim"
debian = [13]
# intel-media-va-driver-non-free is in non-free.
requires = ["components"]
conflicts = ["multimedia-codecs"]
successor = "multimedia-codecs"
# The non-free Intel driver replaces the free one; it comes back on removal.
replaces = ["intel-media-va-driver"]
packages = ["ffmpeg", "gstreamer1.0-libav", "gstreamer1.0-plugins-bad", "gstreamer1.0-plugins-ugly", "intel-media-va-driver-non-free"]
