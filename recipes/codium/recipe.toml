name = "codium"
description = "VSCodium: VS Code without Microsoft telemetry and branding"
kind = "vendor-repository"
version = "1.143.17232"
maintainer = "hmwassim"
debian = [13]
repository = "vscodium"
# After its own: what the bundled Microsoft Authentication extension's
# native sign-in helper (libmsalruntime.so) loads. The vendor declares
# libcurl by names Debian 13 resolves to the GnuTLS build, and the rest
# not at all.
packages = ["codium", "libcurl4t64", "libsecret-1-0", "libsoup-3.0-0", "libwebkit2gtk-4.1-0"]

# The vendor's scripts, without Microsoft's source or the Copilot link.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	ln -sf /usr/share/codium/bin/codium /usr/bin/codium
	update-alternatives --install /usr/bin/editor editor /usr/bin/codium 0
	update-desktop-database -q 2>/dev/null || true
	update-mime-database /usr/share/mime 2>/dev/null || true
fi
"""
prerm = """
#!/bin/sh
set -e
if [ "$1" = remove ]; then
	update-alternatives --remove editor /usr/bin/codium
fi
"""
postrm = """
#!/bin/sh
set -e
if [ "$1" = remove ] || [ "$1" = purge ]; then
	rm -f /usr/bin/codium
	update-desktop-database -q 2>/dev/null || true
	update-mime-database /usr/share/mime 2>/dev/null || true
fi
"""
config = ""
templates = ""
