name = "config-bash"
description = "Bash defaults: history, completion and shell tool integration"
kind = "setup"
version = "1"
revision = 3
maintainer = "hmwassim"
debian = [13]
packages = ["bash-completion"]
user-notes = "grep -qxF '[ -r /etc/dovy/bashrc.d/00-dovy.sh ] && . /etc/dovy/bashrc.d/00-dovy.sh' ~/.bashrc || echo '[ -r /etc/dovy/bashrc.d/00-dovy.sh ] && . /etc/dovy/bashrc.d/00-dovy.sh' >> ~/.bashrc"

[[file]]
path = "/etc/dovy/bashrc.d/00-dovy.sh"
content = """
# History written after every command, so no terminal loses it.
HISTSIZE=10000
HISTFILESIZE=20000
HISTCONTROL=ignoreboth:erasedups
shopt -s histappend
PROMPT_COMMAND="history -a${PROMPT_COMMAND:+; $PROMPT_COMMAND}"
shopt -s checkwinsize
command -v fzf >/dev/null && eval "$(fzf --bash)"
command -v zoxide >/dev/null && eval "$(zoxide init bash)"
# Not on the Linux console: it cannot show starship's symbols.
[ "$TERM" = linux ] || { command -v starship >/dev/null && eval "$(starship init bash)"; }
case $- in *i*) bind 'set completion-ignore-case on' ;; esac
if command -v eza >/dev/null; then
	alias ls='eza -al --icons --color=auto --group-directories-first'
	alias la='eza -a --icons --color=auto --group-directories-first'
	alias ll='eza -l --icons --color=auto --group-directories-first'
	alias lt='eza -aT --icons --color=auto --group-directories-first'
fi
command -v batcat >/dev/null && alias cat='batcat --style=plain --paging=never'
"""
