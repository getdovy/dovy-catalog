name = "config-pipewire"
description = "PipeWire audio: common sample rates without resampling, larger buffers for Wine and Proton games, HDMI kept awake"
kind = "setup"
version = "1"
revision = 2
maintainer = "hmwassim"
debian = [13]
packages = ["pipewire-audio"]

[[file]]
path = "/etc/pipewire/pipewire.conf.d/00-dovy.conf"
content = """
# Rates the device may switch to, so 44.1 kHz and 96 kHz audio play
# untouched instead of being resampled to 48 kHz.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
}
"""

[[file]]
path = "/etc/pipewire/pipewire-pulse.conf.d/00-dovy-wine.conf"
content = """
# Wine and Proton games crackle with PipeWire's smallest buffers: at least
# 1024 samples (about 21 ms at 48 kHz). Debian's Wine runs as wine64;
# WineHQ's and Proton's as wine-preloader or wine64-preloader.
pulse.rules = [
    {
        matches = [ { application.process.binary = "~^wine(64)?(-preloader)?$" } ]
        actions = { update-props = { pulse.min.quantum = 1024/48000 } }
    }
]
"""

[[file]]
path = "/etc/wireplumber/wireplumber.conf.d/50-dovy-hdmi.conf"
content = """
# HDMI and DisplayPort outputs stay awake: TVs and receivers otherwise cut
# off the first second of sound after 5 s of silence.
monitor.alsa.rules = [
    {
        matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
        actions = { update-props = { session.suspend-timeout-seconds = 0 } }
    }
]
"""
