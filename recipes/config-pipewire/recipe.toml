name = "config-pipewire"
description = "PipeWire audio tuning for sample rates, games and HDMI"
kind = "setup"
version = "1"
revision = 3
maintainer = "hmwassim"
debian = [13]
packages = ["pipewire-audio"]
# The pipewire group gets Debian's real-time limits (25-pw-rlimits.conf).
user-notes = "sudo usermod -aG pipewire \"$USER\""

[[file]]
path = "/etc/pipewire/pipewire.conf.d/00-dovy.conf"
content = """
# Rates the device may switch to, so 44.1 and 96 kHz audio is not resampled.
context.properties = {
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
}
"""

[[file]]
path = "/etc/pipewire/pipewire-pulse.conf.d/00-dovy-wine.conf"
content = """
# Wine and Proton crackle with the smallest buffers. Debian's Wine runs as
# wine64; WineHQ's and Proton's as wine-preloader or wine64-preloader.
pulse.rules = [
    {
        matches = [ { application.process.binary = "~^wine(64)?(-preloader)?$" } ]
        actions = { update-props = { pulse.min.quantum = 1024/48000 } }
    }
]
"""

[[file]]
path = "/etc/wireplumber/wireplumber.conf.d/50-dovy-hdmi.conf"
content = """
# HDMI and DisplayPort stay awake (TVs cut the first second after silence)
# and rank after other outputs, so monitor speakers are not picked first.
monitor.alsa.rules = [
    {
        matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
        actions = { update-props = { session.suspend-timeout-seconds = 0, priority.driver = 100, priority.session = 100 } }
    }
]
"""
