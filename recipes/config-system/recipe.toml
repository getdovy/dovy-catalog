name = "config-system"
description = "System tuning for disks, memory, shutdown and logs"
kind = "setup"
version = "1"
revision = 5
maintainer = "hmwassim"
debian = [13]
packages = ["hdparm"]

[[file]]
path = "/etc/sysctl.d/00-dovy-system.conf"
content = """
# Fixed writeback limits: with 20%/10% of RAM, USB copies report done long
# before the data is written.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728
# Keep file metadata cached longer (default 100).
vm.vfs_cache_pressure = 50
# No proactive compaction: it adds latency jitter (default 20).
vm.compaction_proactiveness = 0
# Some games fail to load with the default 65530.
vm.max_map_count = 1048576

# Frees a CPU performance counter; the soft lockup detector stays.
kernel.nmi_watchdog = 0
# The split-lock pause slows some Windows games under Proton. "-": no error
# on CPUs without split-lock detection.
-kernel.split_lock_mitigate = 0
# No kernel messages on the console below errors.
kernel.printk = 3 3 3 3
# Kernel addresses hidden from regular users; root still sees them.
kernel.kptr_restrict = 1

# Find a working packet size when a network path drops large packets.
net.ipv4.tcp_mtu_probing = 1

# File watchers for IDEs and sync tools.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
"""

[[file]]
path = "/etc/udev/rules.d/60-dovy-scheduler.rules"
content = """
# BFQ keeps the desktop responsive while a hard disk or SD card is busy.
# SATA SSDs keep mq-deadline, NVMe keeps none.
ACTION=="add|change", SUBSYSTEM=="block", ENV{DEVTYPE}=="disk", KERNEL=="sd*[!0-9]", ATTR{queue/rotational}=="1", ATTR{queue/scheduler}="bfq"
ACTION=="add|change", SUBSYSTEM=="block", ENV{DEVTYPE}=="disk", KERNEL=="mmcblk*[0-9]", ATTR{queue/scheduler}="bfq"
"""

# USB drives and SD cards: at most 6% of vm.dirty_bytes (about 15 MB)
# waiting to be written, so a copy finishes when its data is on the drive,
# not when it is in memory. A ratio, not max_bytes: the kernel stores
# max_bytes as a ratio of the limit at that moment, and at boot udev runs
# before sysctl lowers it, which left 680 KB.
[[file]]
path = "/etc/udev/rules.d/70-dovy-usb-writeback.rules"
content = """
ACTION=="add|change", SUBSYSTEM=="block", ENV{DEVTYPE}=="disk", ENV{ID_BUS}=="usb", ATTR{bdi/strict_limit}="1", ATTR{bdi/max_ratio}="6"
ACTION=="add|change", SUBSYSTEM=="block", ENV{DEVTYPE}=="disk", KERNEL=="mmcblk*[0-9]", ATTR{bdi/strict_limit}="1", ATTR{bdi/max_ratio}="6"
"""

# No head parking or spin-down on desktop and server chassis; laptops and
# USB disks are left alone.
[[file]]
path = "/etc/udev/rules.d/69-dovy-hdparm.rules"
content = """
ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="sd[a-z]", ATTR{queue/rotational}=="1", ENV{ID_BUS}=="ata", ENV{ID_USB_DRIVER}=="", \\
    PROGRAM="/usr/bin/cat /sys/class/dmi/id/chassis_type", RESULT=="3|4|5|6|7|13|15|16|17|23|24|28|29|35|36", \\
    RUN+="/usr/sbin/hdparm -B 254 -S 0 /dev/%k"
"""

# Desktop and server SATA links at full power (same chassis check).
[[file]]
path = "/etc/udev/rules.d/50-dovy-sata-power.rules"
content = """
ACTION=="add", SUBSYSTEM=="scsi_host", KERNEL=="host*", TEST=="link_power_management_policy", \\
    PROGRAM="/usr/bin/cat /sys/class/dmi/id/chassis_type", RESULT=="3|4|5|6|7|13|15|16|17|23|24|28|29|35|36", \\
    ATTR{link_power_management_policy}="max_performance"
"""

[[file]]
path = "/etc/tmpfiles.d/dovy-thp.conf"
content = """
# Debian's huge pages are "always". Stall-free compaction for memory that
# does not ask for them; direct compaction only for memory that does.
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
# Split huge pages more than 80% empty, so they do not waste memory
# (default 511, never split).
w /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
"""

[[file]]
path = "/etc/modules-load.d/dovy-ntsync.conf"
content = """
# NT sync primitives for Wine and Proton (/dev/ntsync).
ntsync
"""

[[file]]
path = "/etc/modprobe.d/dovy-blacklist.conf"
content = """
blacklist pcspkr
blacklist snd-pcsp
# Debian's systemd uses no watchdog unless RuntimeWatchdogSec= is set.
blacklist iTCO_wdt
blacklist sp5100_tco
blacklist wdat_wdt
"""

[[file]]
path = "/etc/systemd/system.conf.d/00-dovy-timeout.conf"
content = """
# A stuck service delays shutdown by 15 s, not 90 s.
[Manager]
DefaultTimeoutStopSec=15s
"""

[[file]]
path = "/etc/systemd/user.conf.d/00-dovy-timeout.conf"
content = """
# A stuck user service delays logout and shutdown by 15 s, not 90 s.
[Manager]
DefaultTimeoutStopSec=15s
"""

[[file]]
path = "/etc/systemd/journald.conf.d/00-dovy-size.conf"
content = """
[Journal]
SystemMaxUse=1G
MaxRetentionSec=3month
"""

[[file]]
path = "/etc/systemd/system/rtkit-daemon.service.d/00-dovy-loglevel.conf"
content = """
# rtkit logs every priority change; keep info and above.
[Service]
LogLevelMax=info
"""
