name = "desktop-plus"
description = "Desktop Plus, a GitHub Desktop fork with features for power users"
kind = "upstream-binary"
version = "3.7.1.0"
maintainer = "hmwassim"
debian = [13]
# Electron needs ALSA; the vendor's Depends miss it.
packages = ["libasound2t64"]

[[source]]
url = "https://github.com/desktop-plus/desktop-plus/releases/download/v3.7.1.0/DesktopPlus-v3.7.1.0-linux-x86_64.deb"
sha256 = "26b990f0a6fe27f88940db043a9839aa622b925785c1dc2e81da49b1e69e486f"

# The vendor's postrm drops the /usr/bin links on every upgrade; these keep
# them until removal. No setuid sandbox helper: Debian allows user namespaces.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	chmod 0755 /usr/lib/desktop-plus/chrome-sandbox
	chmod 0755 /usr/lib/desktop-plus/resources/app/static/desktop-plus-cli
	ln -sf /usr/lib/desktop-plus/desktop-plus /usr/bin/desktop-plus
	ln -sf /usr/lib/desktop-plus/resources/app/static/desktop-plus-cli /usr/bin/desktop-plus-cli
fi
"""
postrm = """
#!/bin/sh
set -e
if [ "$1" = remove ] || [ "$1" = purge ]; then
	rm -f /usr/bin/desktop-plus /usr/bin/desktop-plus-cli
fi
"""
