name = "discord"
description = "Discord chat, from Discord's .deb"
kind = "upstream-binary"
version = "1.0.170"
maintainer = "hmwassim"
debian = [13]

[[source]]
url = "https://dl.discordapp.net/apps/linux/1.0.170/discord-1.0.170.deb"
sha256 = "b57679faa9e3cac1daa7eeea55e9c26b697ce769b5123f88a662ce58184b4807"

# Vendor postinst without deleting caches in every home folder.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	systemctl reload apparmor 2>/dev/null || true
	update-desktop-database -q /usr/share/applications 2>/dev/null || true
fi
"""
