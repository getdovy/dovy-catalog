name = "discord"
description = "Discord chat, from Discord's .deb"
kind = "upstream-binary"
version = "1.0.169"
maintainer = "hmwassim"
debian = [13]

[[source]]
url = "https://dl.discordapp.net/apps/linux/1.0.169/discord-1.0.169.deb"
sha256 = "64d39ef66390149c09ec7d20759a2e4aa0b93efc071d073e3e72155eb86639df"

# Discord's postinst also deletes caches in every home folder (1.6); kept:
# the AppArmor profile and the desktop entry's handlers.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	systemctl reload apparmor 2>/dev/null || true
	update-desktop-database -q /usr/share/applications 2>/dev/null || true
fi
"""
