name = "discord"
description = "Discord chat, from Discord's .deb"
kind = "upstream-binary"
version = "1.0.171"
maintainer = "hmwassim"
debian = [13]

[[source]]
url = "https://dl.discordapp.net/apps/linux/1.0.171/discord-1.0.171.deb"
sha256 = "d9a091f1b3afbdf18ee341b52b75fbb62db21f1e18a6a87ad68da54fd6ec4a10"

# Vendor postinst without deleting caches in every home folder.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	systemctl reload apparmor 2>/dev/null || true
	update-desktop-database -q /usr/share/applications 2>/dev/null || true
fi
"""
