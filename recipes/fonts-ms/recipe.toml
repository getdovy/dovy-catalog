name = "fonts-ms"
description = "Microsoft core fonts, and better rendering for any Microsoft fonts, including Windows fonts copied to ~/.local/share/fonts"
kind = "setup"
version = "1"
maintainer = "hmwassim"
debian = [13]
# ttf-mscorefonts-installer is in contrib; it downloads the fonts and asks
# for Microsoft's EULA.
requires = ["components"]
packages = ["ttf-mscorefonts-installer", "fonts-vazirmatn-variable"]

[[file]]
path = "/etc/fonts/conf.d/52-dovy-fonts-ms.conf"
content = """
<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Microsoft fonts, wherever installed (system or ~/.local/share/fonts):
     outlines instead of embedded bitmaps; Arabic drawn by Vazirmatn, as
     their Arabic is much smaller than their Latin. -->
<fontconfig>
  <match target="font">
    <test name="family"><string>Arial</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Arial</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x0600</int><int>0x06FF</int></range>
          <range><int>0x0750</int><int>0x077F</int></range>
          <range><int>0x0870</int><int>0x08FF</int></range>
          <range><int>0xFB50</int><int>0xFDFF</int></range>
          <range><int>0xFE70</int><int>0xFEFF</int></range>
        </charset>
      </minus>
    </edit>
    <edit name="lang" mode="assign">
      <minus>
        <name>lang</name>
        <langset><string>ar</string><string>fa</string><string>ur</string></langset>
      </minus>
    </edit>
  </match>
  <alias>
    <family>Arial</family>
    <accept><family>Vazirmatn</family></accept>
  </alias>
  <match target="font">
    <test name="family"><string>Times New Roman</string></test>
