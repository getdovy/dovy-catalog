name = "fzf"
description = "Command-line fuzzy finder"
kind = "upstream-binary"
version = "0.75.0"
revision = 2
maintainer = "hmwassim"
debian = [13]
replaces = ["fzf"]
user-notes = '''grep -qxF 'command -v fzf >/dev/null && eval "$(fzf --bash)"' ~/.bashrc || echo 'command -v fzf >/dev/null && eval "$(fzf --bash)"' >> ~/.bashrc'''

