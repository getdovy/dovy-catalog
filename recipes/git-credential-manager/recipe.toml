name = "git-credential-manager"
description = "Git Credential Manager: browser sign-in, credentials in the keyring"
kind = "upstream-binary"
version = "3.0.2"
maintainer = "hmwassim"
debian = [13]
packages = ["libsecret-1-0", "libicu76"]
user-notes = "/usr/lib/git-credential-manager/git-credential-manager configure && git config --global credential.credentialStore secretservice"

# The tarball, as the upstream .deb installs into /usr/local.
[[source]]
url = "https://github.com/git-ecosystem/git-credential-manager/releases/download/v3.0.2/gcm-linux-x64-3.0.2.tar.gz"
sha256 = "b8e59e22a830006ca4d93e34513effbb2d9fc0c45d9ccf40395eaab7c4c1b97e"

[install]
"/usr/lib/git-credential-manager/git-credential-manager" = "git-credential-manager"
"/usr/lib/git-credential-manager/libHarfBuzzSharp.so" = "libHarfBuzzSharp.so"
"/usr/lib/git-credential-manager/libSkiaSharp.so" = "libSkiaSharp.so"
"/usr/lib/git-credential-manager/libmsalruntime.so" = "libmsalruntime.so"
"/usr/share/doc/git-credential-manager/NOTICE" = "NOTICE"
