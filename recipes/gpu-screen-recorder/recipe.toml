name = "gpu-screen-recorder"
description = "Screen recorder using the GPU's video encoder"
kind = "upstream-build"
version = "6.1.6"
maintainer = "hmwassim"
debian = [13]
build-depends = ["meson", "pkgconf", "libavcodec-dev", "libavformat-dev", "libavutil-dev", "libavfilter-dev", "libswresample-dev", "libx11-dev", "libxcomposite-dev", "libxrandr-dev", "libxfixes-dev", "libxdamage-dev", "libpulse-dev", "libva-dev", "libdrm-dev", "libwayland-dev", "libdbus-1-dev", "libcap-dev", "libpipewire-0.3-dev", "libspa-0.2-dev", "libgl-dev", "libegl-dev", "libvulkan-dev"]
packages = ["libcap2-bin", "libavcodec61", "libavformat61", "libavfilter10", "libpulse0", "libva2", "libpipewire-0.3-0t64", "libvulkan1"]

[[source]]
url = "https://dec05eba.com/snapshot/gpu-screen-recorder.git.6.1.6.tar.gz"
sha256 = "6bbb907783e2cbf8b0e6a75d103a4aa3bb0238703ebbc10500b8d1472df52342"

# The build's own install step sets the capability; a package sets it here.
# Without it, recording a monitor on Wayland asks for the password each time.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	setcap cap_sys_admin+ep /usr/bin/gsr-kms-server
fi
"""
