name = "gpu-screen-recorder"
description = "Screen recorder using the GPU's video encoder"
kind = "upstream-build"
version = "6.1.7"
maintainer = "hmwassim"
debian = [13]
build-depends = ["meson", "pkgconf", "libavcodec-dev", "libavformat-dev", "libavutil-dev", "libavfilter-dev", "libswresample-dev", "libx11-dev", "libxcomposite-dev", "libxrandr-dev", "libxfixes-dev", "libxdamage-dev", "libpulse-dev", "libva-dev", "libdrm-dev", "libwayland-dev", "libdbus-1-dev", "libcap-dev", "libpipewire-0.3-dev", "libspa-0.2-dev", "libgl-dev", "libegl-dev", "libvulkan-dev"]
packages = ["libcap2-bin", "libavcodec61", "libavformat61", "libavfilter10", "libpulse0", "libva2", "libpipewire-0.3-0t64", "libvulkan1", "libwayland-egl1", "libxcomposite1", "libxdamage1", "libxrandr2"]

[[source]]
url = "https://dec05eba.com/snapshot/gpu-screen-recorder.git.6.1.7.tar.gz"
sha256 = "17be095ed8c6200c467c1477cc127c97b056b25071443d015e0ef026cf3fcd73"

# Set here instead of by the build. Without it, recording a monitor on
# Wayland asks for the password each time.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	setcap cap_sys_admin+ep /usr/bin/gsr-kms-server
fi
"""
