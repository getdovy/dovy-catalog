name = "herdr-desktop"
description = "Herdr desktop app"
kind = "upstream-binary"
version = "0.1.17"
maintainer = "hmwassim"
debian = [13]
packages = ["libxcb1", "libxkbcommon0"]

[[source]]
url = "https://releases.herdr.dev/app/0.1.17/herdr-app-linux-x86_64.tar.gz"
sha256 = "2188f4d7d5cf041450dbdbf2e14649244b1a6274a1080bdd97fa7bc450e65ca1"

[install]
"/usr/lib/herdr-app" = "herdr-app"
"/usr/share/icons/hicolor/scalable/apps/herdr-app.svg" = "herdr-app/herdr-app.svg"

[links]
"/usr/bin/herdr-app" = "/usr/lib/herdr-app/herdr-app"
