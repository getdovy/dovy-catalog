name = "heroic"
description = "Heroic Games Launcher for Epic, GOG and Amazon games"
kind = "upstream-binary"
version = "2.22.4"
maintainer = "hmwassim"
debian = [13]

[[source]]
url = "https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/releases/download/v2.22.4/Heroic-2.22.4-linux-amd64.deb"
sha256 = "46aa36778f16d98a86823fc42fcb7ef47efab346ff19380165201aa373ebf70a"

# The vendor's postinst also copies an AppArmor profile into /etc for
# Ubuntu's user-namespace restriction, which Debian does not have. These
# scripts keep the rest. Debian allows user namespaces, so the sandbox
# helper needs no setuid bit.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	update-alternatives --install /usr/bin/heroic heroic /opt/Heroic/heroic 100
	chmod 0755 /opt/Heroic/chrome-sandbox
	update-mime-database /usr/share/mime 2>/dev/null || true
	update-desktop-database -q /usr/share/applications 2>/dev/null || true
fi
"""
postrm = """
#!/bin/sh
set -e
if [ "$1" = remove ] || [ "$1" = purge ]; then
	update-alternatives --remove heroic /opt/Heroic/heroic 2>/dev/null || true
fi
"""
