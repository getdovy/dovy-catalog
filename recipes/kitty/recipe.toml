name = "kitty"
description = "GPU-based terminal emulator"
kind = "upstream-binary"
version = "0.51.0"
maintainer = "hmwassim"
debian = [13]
replaces = ["kitty"]
packages = ["libdbus-1-3", "libfontconfig1", "libx11-6", "libx11-xcb1", "libxcb-xkb1", "libxcursor1"]

[[source]]
url = "https://github.com/kovidgoyal/kitty/releases/download/v0.51.0/kitty-0.51.0-x86_64.txz"
sha256 = "c285daaf1b699997614939c8d1cd92dd8b99302ff12f18efcc3f69382aa72b1d"

[install]
"/usr/lib/kitty" = "."
"/usr/share/applications/kitty.desktop" = "share/applications/kitty.desktop"
"/usr/share/icons/hicolor/256x256/apps/kitty.png" = "share/icons/hicolor/256x256/apps/kitty.png"
"/usr/share/icons/hicolor/scalable/apps/kitty.svg" = "share/icons/hicolor/scalable/apps/kitty.svg"

[links]
"/usr/bin/kitten" = "/usr/lib/kitty/bin/kitten"
"/usr/bin/kitty" = "/usr/lib/kitty/bin/kitty"
