name = "mangohud"
description = "MangoHud: performance overlay for games, 64-bit and 32-bit"
kind = "setup"
version = "1"
revision = 2
maintainer = "hmwassim"
debian = [13]
packages = ["mangohud", "mangohud:i386", "mangoapp"]

[[file]]
path = "/etc/udev/rules.d/60-dovy-powercap.rules"
content = """
# CPU power for MangoHud and powertop without root. Group only: world-readable
# energy counters are a side channel (CVE-2020-8694).
ENV{SUBSYSTEM}=="powercap", ACTION=="add|change", RUN+="/usr/bin/find /sys$env{DEVPATH} -name energy_uj -exec chmod 440 {} + -exec chown root:video {} +"
"""
