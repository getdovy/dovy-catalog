name = "mesa-backports"
description = "Mesa graphics drivers from Debian backports"
kind = "setup"
version = "1"
maintainer = "hmwassim"
debian = [13]
conflicts = ["mesa"]
backports = true
packages = [
  "mesa-vulkan-drivers",
  "libgl1-mesa-dri",
  "libglx-mesa0",
  "libegl-mesa0",
  "libgbm1",
  "mesa-va-drivers",
  # Backports' mesa-libgallium replaces Debian's 25.0 VDPAU drivers; taken from
  # backports too, so apt upgrades them instead of removing them.
  "mesa-vdpau-drivers",
  "mesa-libgallium",
]
