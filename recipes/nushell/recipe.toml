name = "nushell"
description = "Shell with structured data (nu)"
kind = "upstream-binary"
version = "0.117.0"
maintainer = "hmwassim"
debian = [13]

[[source]]
url = "https://github.com/nushell/nushell/releases/download/0.117.0/nu-0.117.0-x86_64-unknown-linux-musl.tar.gz"
sha256 = "2b808786d44af41170a29f8b9a15b5113bb6ea5dda9221098eca932f8a149924"

[install]
"/usr/bin/nu" = "nu-0.117.0-x86_64-unknown-linux-musl/nu"
"/usr/bin/nu_plugin_formats" = "nu-0.117.0-x86_64-unknown-linux-musl/nu_plugin_formats"
"/usr/bin/nu_plugin_gstat" = "nu-0.117.0-x86_64-unknown-linux-musl/nu_plugin_gstat"
"/usr/bin/nu_plugin_inc" = "nu-0.117.0-x86_64-unknown-linux-musl/nu_plugin_inc"
"/usr/bin/nu_plugin_polars" = "nu-0.117.0-x86_64-unknown-linux-musl/nu_plugin_polars"
"/usr/bin/nu_plugin_query" = "nu-0.117.0-x86_64-unknown-linux-musl/nu_plugin_query"

[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	add-shell /usr/bin/nu
fi
"""
postrm = """
#!/bin/sh
set -e
if [ "$1" = remove ] || [ "$1" = purge ]; then
	remove-shell /usr/bin/nu 2>/dev/null || true
fi
"""
