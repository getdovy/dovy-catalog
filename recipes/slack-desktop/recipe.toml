name = "slack-desktop"
description = "Slack (proprietary)"
kind = "upstream-binary"
version = "4.53.292"
maintainer = "hmwassim"
debian = [13]

[[source]]
url = "https://downloads.slack-edge.com/desktop-releases/linux/x64/4.53.292/slack-desktop-4.53.292-amd64.deb"
sha256 = "c6316a7d15ebc17527a287f88aa27bed89869b15f32c5abe610475c134c910fd"

# Stops Slack's daily cron job from adding its keys and apt source.
[[file]]
path = "/etc/default/slack"
content = """
repo_add_once="false"
repo_reenable_on_distupgrade="false"
"""
