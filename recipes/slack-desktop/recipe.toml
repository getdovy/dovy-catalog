name = "slack-desktop"
description = "Slack (proprietary)"
kind = "upstream-binary"
version = "4.53.287"
maintainer = "hmwassim"
debian = [13]

[[source]]
url = "https://downloads.slack-edge.com/desktop-releases/linux/x64/4.53.287/slack-desktop-4.53.287-amd64.deb"
sha256 = "c2057f221e41275b7eadc5b658edc00289466b6fb55c912c5894831f6900f969"

# Stops Slack's daily cron job from adding its keys and apt source.
[[file]]
path = "/etc/default/slack"
content = """
repo_add_once="false"
repo_reenable_on_distupgrade="false"
"""
