name = "steam"
description = "Valve's Steam client, from Debian contrib"
kind = "setup"
version = "1"
maintainer = "hmwassim"
debian = [13]
requires = ["components"]
# Debian's wiki: 32-bit Mesa for games, beside steam-installer.
packages = [
  "steam-installer",
  "mesa-vulkan-drivers",
  "libgl1-mesa-dri:i386",
  "libglx-mesa0:i386",
  "mesa-vulkan-drivers:i386",
]
