name = "tuned-profiles"
description = "Power profiles from tuned, with a desktop performance profile"
kind = "setup"
version = "1"
maintainer = "hmwassim"
debian = [13]
conflicts = ["power-profiles"]
replaces = ["power-profiles-daemon"]
packages = ["tuned-ppd"]

# The desktop's Performance profile maps to this server profile; replaced
# with CPU and firmware settings only.
[[file]]
path = "/etc/tuned/profiles/throughput-performance/tuned.conf"
content = """
[main]
summary=Desktop performance (dovy): CPU, firmware and SATA links at performance; memory, disk and network as Debian sets them

# Left out from Debian's version: min_perf_pct=100 (heat, fan noise),
# vm.swappiness=10 (works against zram), dirty ratios, readahead, somaxconn.
[cpu]
governor=performance
energy_perf_bias=performance
energy_performance_preference=performance
boost=1

[acpi]
platform_profile=performance

[video]
panel_power_savings=0

# No SATA wake-up delay; balanced and power saver keep link power saving.
[scsi_host]
alpm=max_performance
"""
