name = "vesktop"
description = "Discord client with Vencord; screen sharing with audio on Wayland"
kind = "upstream-binary"
version = "1.7.0"
maintainer = "hmwassim"
debian = [13]
# Electron needs ALSA; the vendor's Depends miss it.
packages = ["libasound2t64"]

[[source]]
url = "https://github.com/Vencord/Vesktop/releases/download/v1.7.0/vesktop_1.7.0_amd64.deb"
sha256 = "ddddd9b50d3075ff2e9f298605fe1a90aec7dc9804ae0bfeea1f55ab7928850d"

# Vendor postinst without its Ubuntu AppArmor profile. No setuid sandbox
# helper: Debian allows user namespaces.
[scripts]
postinst = """
#!/bin/sh
set -e
if [ "$1" = configure ]; then
	update-alternatives --install /usr/bin/vesktop vesktop /opt/Vesktop/vesktop 100
	chmod 0755 /opt/Vesktop/chrome-sandbox
	update-mime-database /usr/share/mime 2>/dev/null || true
	update-desktop-database -q /usr/share/applications 2>/dev/null || true
fi
"""
postrm = """
#!/bin/sh
set -e
if [ "$1" = remove ] || [ "$1" = purge ]; then
	update-alternatives --remove vesktop /opt/Vesktop/vesktop 2>/dev/null || true
fi
"""
