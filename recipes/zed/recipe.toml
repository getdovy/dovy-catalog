name = "zed"
description = "Code editor"
kind = "upstream-binary"
version = "1.28.1"
maintainer = "hmwassim"
debian = [13]
packages = ["libasound2t64", "libglib2.0-0t64"]

[[source]]
url = "https://github.com/zed-industries/zed/releases/download/v1.28.1/zed-linux-x86_64.tar.gz"
sha256 = "9c3fc4cbe533e72c8d0e864a62be2b88d69cc44b9f52cd25d4c21d054dda3742"

[install]
"/usr/lib/zed" = "zed.app"
"/usr/share/applications/dev.zed.Zed.desktop" = "zed.app/share/applications/dev.zed.Zed.desktop"
"/usr/share/icons/hicolor/512x512/apps/zed.png" = "zed.app/share/icons/hicolor/512x512/apps/zed.png"

[links]
"/usr/bin/zed" = "/usr/lib/zed/bin/zed"
