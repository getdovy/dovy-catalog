name = "zed"
description = "Code editor"
kind = "upstream-binary"
version = "1.29.3"
maintainer = "hmwassim"
debian = [13]
packages = ["libasound2t64", "libglib2.0-0t64"]

[[source]]
url = "https://github.com/zed-industries/zed/releases/download/v1.29.3/zed-linux-x86_64.tar.gz"
