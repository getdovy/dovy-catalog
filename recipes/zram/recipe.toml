name = "zram"
description = "Compressed swap in RAM"
kind = "setup"
version = "1"
revision = 2
maintainer = "hmwassim"
debian = [13]
packages = ["systemd-zram-generator"]

# 00- sorts first, so the user's own drop-ins win.
[[file]]
path = "/etc/systemd/zram-generator.conf.d/00-dovy.conf"
content = """
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
"""

# Swap in RAM is cheap: swap as readily as dropping cache.
[[file]]
path = "/etc/sysctl.d/00-dovy-zram.conf"
content = """
vm.swappiness = 100
vm.page-cluster = 0
"""
