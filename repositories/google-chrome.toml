name = "google-chrome"
uri = "https://dl.google.com/linux/chrome/deb/"
suite = "stable"
components = ["main"]
key-url = "https://dl.google.com/linux/linux_signing_key.pub"
fingerprints = ["EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"]
maintainer = "hmwassim"

# Stops Chrome's postinst and daily cron from adding Google's own source;
# dovy's repository package provides it.
[[file]]
path = "/etc/default/google-chrome"
content = """
repo_add_once="false"
repo_reenable_on_distupgrade="false"
"""
